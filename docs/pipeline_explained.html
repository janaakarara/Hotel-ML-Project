<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel clustering pipeline, explained</title>
<style>
:root{--bg:#fff;--fg:#1a1a18;--mu:#5f5e5a;--cd:#f4f3ee;--bd:#d9d7cf;--a:#2a78d6;--o:#eb6834;--g:#1baf7a;--v:#6250d6;--r:#e34948}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--fg:#ecebe5;--mu:#aaa9a0;--cd:#262624;--bd:#3a3a37}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}
.w{max-width:920px;margin:0 auto;padding:24px 16px 60px}h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}nav a,.c{font-size:12px;padding:3px 9px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--fg);text-decoration:none;display:inline-block;margin:2px}
section{border:1px solid var(--bd);border-radius:12px;padding:16px;margin:0 0 18px;background:var(--bg)}h2{font-size:18px;margin:0 0 10px}
.q{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:12px}.q div{background:var(--cd);border-radius:8px;padding:8px 10px;font-size:13px}.q b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.v{border-top:1px dashed var(--bd);padding-top:10px}.br{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.br i{flex:0 0 170px;font-style:normal}.br span{flex:1}.br b{display:block;height:14px;border-radius:3px}.br em{font-style:normal;color:var(--mu);flex:0 0 70px;text-align:right}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.g4 p{font-size:12px;margin:2px 0;color:var(--mu)}svg{width:100%;height:auto;color:var(--fg)}
.hm{display:grid;grid-template-columns:60px repeat(4,1fr);gap:3px;font-size:12px;text-align:center;max-width:420px}.hm div{padding:6px;border-radius:4px}
.n{font-size:12px;color:var(--mu);margin:6px 0 0}
</style></head><body><div class="w">
<h1>From raw bookings to customer segments</h1><p class="sub">City Hotel (H2) clustering part, every step: what it does, how, why we did it, why it is better. Numbers come from your repo's own outputs.</p><nav id="nav"></nav><div id="main"></div></div>
<script>
const B=(a,m,c='var(--a)')=>a.map(x=>`<div class=br><i>${x[0]}</i><span><b style="width:${Math.max(1,Math.abs(x[1])/m*100)}%;background:${x[2]||c}"></b></span><em>${x[3]??x[1]}</em></div>`).join('');
const C=(a,c)=>a.map(x=>`<span class=c style="${c?'border-color:'+c:''}">${x}</span>`).join('');
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const bl=(cx,cy,n,sp,col)=>{let o='';for(let i=0;i<n;i++)o+=`<circle cx="${(cx+(r()+r()+r()-1.5)*sp).toFixed(0)}" cy="${(cy+(r()+r()+r()-1.5)*sp).toFixed(0)}" r="2.5" fill="${col}" opacity=".75"/>`;return o};
const SV=(i)=>`<svg viewBox="0 0 260 150">${i}</svg>`;
const ring=(x,y)=>`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="currentColor" stroke-width="2"/>`;
const A='var(--a)',O='var(--o)',G='var(--g)',V='var(--v)',R='var(--r)';
const S=[
{k:'Bad rows',t:'1 · Cleaning: removing bad rows',w:'Turns raw H2.csv (79,330 rows) into h2_clean.csv (53,036 rows).',h:'Each rule removes rows and logs the count in cleaning_log.csv: exact duplicates, zero guests, zero nights, Babies above 2, ADR above 1000, Undefined segment or channel.',y:'A booking with no guests or no nights is a data error and would create fake clusters.',b:'Every removal is logged, so it can be defended. Duplicates are a judgment call because there is no booking ID.',
v:()=>B([['Exact duplicates',25902,O,'25,902'],['Zero nights',231,A,'231'],['Zero guests',154,A,'154'],['Babies, ADR, Undefined',7,A,'7'],['Zero adults (clustering only)',219,V,'219']],26000)},
{k:'Missing values',t:'2 · Cleaning: missing values',w:'Fills or encodes every empty cell.',h:'Company becomes a has_company flag, Agent NULL becomes "none", Country NULL becomes "Unknown", Children NaN becomes 0.',y:'Distance maths cannot handle NaN.',b:'Missing stays as information (no agent is a real booking type) instead of guessing or deleting rows.',
v:()=>B([['Company empty',50294,A,'50,294 → flag'],['Agent empty',5469,A,'5,469 → "none"'],['Country empty',3,A,'3 → Unknown']],50294)},
{k:'Leakage',t:'3 · Dropping outcome and future columns',w:'Removes 9 columns before any statistics are run.',h:'Decided from the dataset paper. Example: BookingChanges counts changes "until check-in or cancellation", so it is only known after the outcome. The dropped columns are saved in profile_cols.csv to describe clusters afterwards.',y:'Spec section 10 says clustering must stay unsupervised and leak-free.',b:'Clusters cannot secretly encode the answer. ADR and cancel rate then work as an independent check.',
v:()=>C(['IsCanceled','ReservationStatus','ReservationStatusDate'],R)+C(['AssignedRoomType','BookingChanges','DepositType'],O)+C(['RequiredCarParkingSpaces (0 of 1,886 canceled)','TotalOfSpecialRequests'],'#eda100')+C(['ADR'],V)+'<p class=n>Red: outcome. Orange: future event. Yellow: suspected future. Violet: outcome-like.</p>'},
{k:'Near-constant',t:'4 · Dropping near-constant columns',w:'Drops 5 columns that are almost always 0.',h:'Stage 2a measures the share of zeros per column (stage2a_constancy.png). Above about 97% the column goes.',y:'A column that is 0 for 97% of rows adds noise but almost no separation.',b:'Fewer dimensions, so every remaining feature gets a bigger say in the distance.',
v:()=>B([['Babies',99.32],['DaysInWaitingList',98.65],['PreviousCancellations',97.79],['PreviousBookingsNotCanceled',97.13],['IsRepeatedGuest',97.08]],100,O).replace(/<em>(\d+\.\d+)/g,'<em>$1%')},
{k:'Redundancy',t:'5 · Dropping duplicated information',w:'Drops 6 columns that repeat another one.',h:'Cramér\'s V (category vs category), eta (number vs category) and Spearman (number vs number) find pairs. One of each pair is dropped.',y:'Two columns carrying the same idea count twice in the distance.',b:'Each idea gets one vote. Agent also had 224 categories, so one-hot would have flooded the data.',
v:()=>B([['Agent ~ DistributionChannel',.86],['has_company ~ MarketSegment',.85],['DistChannel ~ has_company',.82],['DistChannel ~ MarketSegment',.77],['WeekNumber ~ Month (eta)',.995]],1,V)},
{k:'Judgment drops',t:'6 · Two judgment-call drops',w:'Removes ArrivalDateDayOfMonth and ArrivalDateYear.',h:'Day of month is spread evenly and relates to nothing. The data covers only July 2015 to August 2017, so year is a calendar artifact.',y:'They add dimensions without describing a type of guest.',b:'The month (season) is kept, which is the part that describes behaviour.',v:()=>C(['Day of month: no pattern','Year: only 2015-2017'])},
{k:'Country',t:'7 · Country: 167 values into 4 groups',w:'Replaces 167 country codes with Portugal, Latin Europe, Rest of Europe, Outside Europe.',h:'Groups were chosen for balance (14% to 36% each) and meaning. Lead time separates them clearly.',y:'167 codes would make 167 columns that drown every other feature.',b:'No rare categories, 4 interpretable groups.',
v:()=>'<p class=n>Share of rows</p>'+B([['Portugal',24.4],['Latin Europe',26.1],['Rest of Europe',35.6],['Outside Europe',13.9]],40,A)+'<p class=n>Median lead time (days)</p>'+B([['Portugal',26],['Latin Europe',49],['Rest of Europe',74],['Outside Europe',40]],80,O)},
{k:'Rare merges',t:'8 · Merging rare categories',w:'Any value under 1% of rows is merged.',h:'Merged with a close relative when one exists, otherwise into "Other".',y:'A category with 0.02% of rows cannot form a group.',b:'Keeps the encoding stable and the clusters from chasing tiny categories.',v:()=>C(['Meal: FB → HB/FB (4→3)','CustomerType: Group → Transient-Party/Group (4→3)','MarketSegment: Complementary, Aviation → Other (7→6)','ReservedRoomType: G, C → Other (7→6)'])},
{k:'Skew',t:'9 · Fixing skewed numbers',w:'Reshapes long-tailed columns so a few extreme bookings do not dominate.',h:'Yeo-Johnson for LeadTime and week nights, square root for weekend nights. The method with the lowest skew in stage 3a was used.',y:'Distances grow with the tail, so one 600-day booking would act like a cluster centre.',b:'Skew drops to nearly 0 for all three.',
v:()=>'<p class=n>Skew before (orange) and after (blue)</p>'+B([['LeadTime before',1.58,O],['LeadTime after',-.12,A],['WeekNights before',2.52,O],['WeekNights after',.02,A],['WeekendNights before',1.0,O],['WeekendNights after',-.01,A]],2.6)},
{k:'HasChildren',t:'10 · Children becomes a yes/no flag',w:'Children (0, 1, 2...) becomes HasChildren (0 or 1).',h:'91% of values are 0 and no transform fixes that (every one stayed above skew 2.8).',y:'For segments the question is whether children are present.',b:'A clean flag instead of an unfixable skewed number. Caution: see section 22.',v:()=>B([['No children',91,A,'91%'],['Children',9,O,'9%']],100)},
{k:'Scaling',t:'11 · Scaling to the same units',w:'Z-scores the 5 numeric columns: subtract the mean, divide by the standard deviation.',h:'Stage 4a compared scalers in plots, 4b applied StandardScaler. Saved mean and std let the app repeat it on new bookings.',y:'Nights (0 to 8) and lead time (0 to 600) would otherwise let lead time win every distance.',b:'Every column has mean 0 and spread 1, so they start with equal weight.',
v:()=>SV('<path d="M10 125C60 125 80 25 130 25S200 125 250 125" fill="none" stroke="var(--a)" stroke-width="3"/><path d="M95 125V60M165 125V60" stroke="var(--o)" stroke-dasharray="4"/><text x="130" y="145" text-anchor="middle" font-size="11" fill="currentColor">mean 0, one std = 1 unit</text>')},
{k:'Month circle',t:'12 · Month as a circle (sin and cos)',w:'ArrivalDateMonth becomes two columns, sin and cos.',h:'Month m is placed on a circle at angle 2π(m−1)/12; sin and cos are its two coordinates.',y:'December and January are neighbours, but as numbers 12 and 1 look far apart.',b:'The distance respects the calendar loop.',
v:()=>SV([...Array(12)].map((_,i)=>{const a=i/12*2*Math.PI-Math.PI/2,x=130+55*Math.cos(a),y=72+55*Math.sin(a),h=i==0||i==11;return `<circle cx="${x}" cy="${y}" r="${h?7:4}" fill="${h?'var(--o)':'var(--a)'}"/><text x="${130+72*Math.cos(a)}" y="${75+68*Math.sin(a)}" font-size="10" text-anchor="middle" fill="currentColor">${i+1}</text>`}).join(''))},
{k:'Frequency encoding',t:'13 · Encoding categories as frequencies',w:'Each category becomes how common it is (share of rows), then a z-score.',h:'Meal: BB 77.2%, SC 17.6%, HB/FB 5.3% become +0.54, −1.72, −2.19. One column per category feature instead of many.',y:'One-hot gave 29 columns and let categories outvote the numbers.',b:'It won the fair test (Gower silhouette) for K-Means, GMM and Agglomerative. DBSCAN was a near tie.',
v:()=>B([['Meal BB',.54,A,'+0.54'],['Meal SC',1.72,O,'−1.72'],['Meal HB/FB',2.19,O,'−2.19']],2.5)+'<p class=n>Fair score, frequency (blue) vs one-hot (orange)</p>'+B([['K-Means freq',.198],['K-Means one-hot',.126,O],['GMM freq',.201],['GMM one-hot',.145,O],['Agglom. freq',.214],['Agglom. one-hot',.086,O],['DBSCAN freq',.069],['DBSCAN one-hot',.074,O]],.25)},
{k:'Shared input',t:'14 · One shared input and one ruler',w:'Every model reads the same 12-column matrix through common.py.',h:'Seed 42, one fixed 10k-row sample for silhouette, DBSCAN noise counted as its own group, PCA used only for drawing.',y:'Models can only be compared if they see the same data and are scored the same way.',b:'No model gets an easier test; DBSCAN cannot hide its noise.',v:()=>C(['52,817 rows','12 columns','seed 42','10k silhouette sample','noise = own group','PCA for plots only'])},
{k:'Algorithms',t:'15 · The four algorithms',w:'Four ways to group bookings.',h:'K-Means moves k centres. GMM fits overlapping blobs. Agglomerative merges closest groups and is cut at a height. DBSCAN grows clusters from dense areas.',y:'The spec asks for 3 or more, and each fails differently, which shows what the data is like.',b:'Agreement between different methods is stronger evidence than any one method.',
v:()=>'<div class=g4><div>'+SV(bl(55,75,25,40,A)+bl(130,40,25,40,O)+bl(195,100,25,40,G)+ring(55,75)+ring(130,40)+ring(195,100))+'<p>K-Means: nearest centre wins (rings)</p></div><div>'+SV('<ellipse cx="70" cy="70" rx="55" ry="30" fill="var(--a)" opacity=".2"/><ellipse cx="150" cy="80" rx="40" ry="50" fill="var(--o)" opacity=".2"/>'+bl(70,70,25,50,A)+bl(150,80,25,45,O))+'<p>GMM: soft, overlapping blobs</p></div><div>'+SV('<path d="M30 135V100H70V135M110 135V90H150V135M190 135V105H230V135M50 100V60H130V90M90 60V25H210V105" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 75H250" stroke="var(--o)" stroke-dasharray="4"/>')+'<p>Agglomerative: cut the tree (dashed)</p></div><div>'+SV(bl(100,75,45,40,A)+bl(130,75,8,150,"#999")+'<circle cx="100" cy="75" r="30" fill="none" stroke="var(--o)" stroke-dasharray="4"/>')+'<p>DBSCAN: eps circle, grey = noise</p></div></div>'},
{k:'Tuning',t:'16 · Baseline, then systematic tuning',w:'Each algorithm runs once with defaults, then over a grid of settings.',h:'K-Means: k 2-10, init, n_init (36 settings). Agglomerative: 5 linkage/metric pairs x k 2-10 (45). DBSCAN: 8 eps x 5 min_samples (40). GMM: k and covariance type. Chosen by silhouette, never by labels.',y:'The spec requires baseline vs tuned for every algorithm.',b:'Shows what tuning really adds. Here, little.',
v:()=>'<p class=n>Share of grid settings that passed the guards</p>'+B([['K-Means (26 of 36)',72,G,'72%'],['Agglomerative (27 of 45)',60,G,'60%'],['DBSCAN (0 of 40)',0,R,'0%']],100)},
{k:'Guards',t:'17 · Guards against fake clusters',w:'A tuned setting is rejected if it fails any rule.',h:'Smallest cluster under 2%; or a near copy of one column (ARI at least 0.9 or NMI at least 0.5); or unstable across seeds or subsamples (ARI under 0.8).',y:'A high silhouette can come from splitting on one easy column.',b:'Only clusters built from several features survive. The thresholds are team-chosen and should be said so in the report.',v:()=>C(['smallest cluster ≥ 2%','ARI < 0.9 vs any column','NMI < 0.5 vs any column','stability ARI ≥ 0.8'])},
{k:'Metrics',t:'18 · The scores, in plain words',w:'Three internal scores and two checks.',h:'Silhouette: how much closer a booking is to its own cluster than the next (−1 to 1). Davies-Bouldin: cluster overlap (lower is better). Calinski-Harabasz: spread between vs inside clusters (higher is better). Stability: same result on another seed. NMI: is it just one column?',y:'No labels exist, so we need scores that need none.',b:'Several scores together are harder to fool than one.',v:()=>B([['Silhouette 0.17 = weak',.17,O],['Silhouette 0.25 = usually "fair"',.25,A],['Silhouette 0.5 = strong',.5,G]],.5)},
{k:'Results',t:'19 · Baseline vs tuned',w:'Silhouette on the common ruler.',h:'Computed on the same 10k rows in the 12-column space, noise counted as a group.',y:'Fair comparison.',b:'K-Means and GMM tuned are best (0.169, 0.167). Agglomerative got slightly worse (0.160 to 0.151). DBSCAN baseline is −0.19.',
v:()=>B([['K-Means baseline',.1563],['K-Means tuned',.1689,O],['GMM baseline',.1476],['GMM tuned',.1672,O],['Agglom. baseline',.1595],['Agglom. tuned',.1513,O],['DBSCAN baseline',.1934,R,'−0.193'],['DBSCAN tuned',.1263,O]],.2)},
{k:'Profiles',t:'20 · What the clusters mean',w:'Describes each cluster in original units (tuned K-Means, k=5).',h:'make_profiles.py averages lead time etc. per cluster. ADR and cancel rate are added only afterwards.',y:'Clusters only matter if a person can read them.',b:'Cancel rate ranges from 18% to 38% although cancellation was never used.',
v:()=>'<p class=n>Average lead time (days)</p>'+B([['Last-minute short stays (22%)',29.5],['Self-catering online (19%)',72.1],['Families (9%)',84.7],['Travel-agent parties (15%)',98.1],['Long-lead online (35%)',100.2]],110)+'<p class=n>Cancel rate afterwards (%)</p>'+B([['Last-minute short stays',20.4],['Self-catering online',38.1],['Families',34.5],['Travel-agent parties',18.0],['Long-lead online',36.2]],45,O)},
{k:'Agreement',t:'21 · Do the models agree?',w:'Compares the tuned labelings with ARI (1 = identical, 0 = random).',h:'K-Means and GMM agree at 0.81. The "families" cluster appears in all four tuned models.',y:'Real structure should survive a change of method.',b:'Tells us which parts of the result to trust.',
v:()=>{const n=['KM','GMM','AGG','DB'],m=[[1,.81,.58,.58],[.81,1,.53,.63],[.58,.53,1,.43],[.58,.63,.43,1]];return '<div class=hm><div></div>'+n.map(x=>`<div>${x}</div>`).join('')+m.map((row,i)=>`<div>${n[i]}</div>`+row.map(v=>`<div style="background:rgba(42,120,214,${v*.8})">${v}</div>`).join('')).join('')+'</div>'}},
{k:'Limits',t:'22 · What is still weak',w:'Four fixable and four unfixable points.',h:'Fixable: HasChildren dominates (z 3.2 vs −0.31 means one cluster is simply "has children"), frequency encoding blurs similar categories, comparison.csv lacks Davies-Bouldin, tidy-up. Unfixable: weak structure, only 12 safe features, no perfect mixed distance, no booking ID.',y:'Honest limits are better than hidden ones.',b:'fix_test.py tested the HasChildren and Meal fixes on a fair ruler. None clearly won, so they were rejected and the result goes in the report.',v:()=>C(['HasChildren dominates','blurred categories','missing DB column','silhouette ≈ 0.17','DBSCAN fails guards'],O)+'<p class=n>Fix test (fair Gower ruler), K-Means best valid: current 0.183, kids x0.5 0.159, kids x0.25 0.160, no kids 0.170, meal ordinal 0.189 (k=6, within noise), kids x0.5 + meal 0.184. Agglomerative ward was unstable in every variant. Decision: keep the current pipeline.</p>'}
];
document.getElementById('nav').innerHTML=S.map((x,i)=>`<a href="#s${i}">${x.k}</a>`).join('');
document.getElementById('main').innerHTML=S.map((x,i)=>`<section id="s${i}"><h2>${x.t}</h2><div class=q><div><b>What it does</b>${x.w}</div><div><b>How it works</b>${x.h}</div><div><b>Why we did it</b>${x.y}</div><div><b>Why it is better</b>${x.b}</div></div><div class=v>${x.v()}</div></section>`).join('');
</script></body></html>
